name: Refresh SEC NAV Data

# Checklist 8.6: replaces "run scripts/sec_download_mvp.py by hand" with a
# scheduler. Runs daily after Thai markets close, re-downloads NAV for the
# current fund universe (data/sec/mvp_fund_universe.csv), runs the full test
# suite against the refreshed data, and only commits+pushes if both the
# download and the tests succeed -- a failed run leaves the last known-good
# cached data untouched instead of committing something broken.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SEC_API_KEY       -- SEC Open Data subscription key
#   SEC_API_BASE_URL  -- optional, defaults to https://api.sec.or.th if unset

on:
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC = 01:00 ICT next day, well after NAV publication
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -e ".[dev]"

      - name: Download latest SEC NAV data
        env:
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}
          SEC_API_BASE_URL: ${{ secrets.SEC_API_BASE_URL }}
        run: python scripts/sec_download_mvp.py

      - name: Run test suite against refreshed data
        run: pytest

      - name: Commit refreshed data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sec/normalized/
          if git diff --cached --quiet; then
            echo "No NAV changes to commit."
          else
            git commit -m "chore(data): scheduled SEC NAV refresh $(date -u +%Y-%m-%d)"
            git push
          fi
